[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-analyzer"
version = "0.1.0"
description = "JWT Security Analyzer CLI — config, fast and assessment modes, ignore rules, and reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
]

[project.scripts]
jwt-analyzer = "jwt_analyzer.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["jwt_analyzer"]

[tool.coverage.report]
fail_under = 80
show_missing = true
