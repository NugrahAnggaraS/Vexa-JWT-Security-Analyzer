name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest tests/unit tests/integration --cov=jwt_analyzer --cov-report=term-missing --cov-fail-under=80
      - name: Parser fuzz corpus
        run: python -m pytest tests/fuzz -q
